name: Publish images

on:
  push:
    branches:
      - main
    paths:
      - ".env.tmpl"
      - ".gitmodules"
      - ".github/workflows/publish-images.yml"
      - ".github/workflows/release.yml"
      - "compose.yaml.tmpl"
      - "compose/**"
      - "configs/**"
      - "deps/container-utilities"
      - "deps/container-utilities/**"
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  attestations: write
  artifact-metadata: write
  contents: read
  id-token: write
  packages: write

env:
  OCI_DESCRIPTION: TYPO3 PHP-FPM runtime image with TYPO3 extensions and container utilities
  OCI_LICENSES: AGPL-3.0-only
  OCI_TITLE: TYPO3 PHP-FPM
  OCI_VENDOR: Strukturpiloten
  SYFT_VERSION: v1.44.0

jobs:
  build-arch-image:
    name: Build ${{ matrix.arch }} image
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release): v')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Install OCI tooling
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends buildah podman skopeo

      - name: Prepare image coordinates
        id: prep
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          owner=$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          base_image=$(grep '^PODMAN_TYPO3PHPFPM_BASE_IMAGE=' .env.tmpl | cut -d= -f2-)
          typo3_data_dir=$(grep '^PODMAN_TYPO3_DATA_DIR_CONTAINER=' .env.tmpl | cut -d= -f2-)
          base_name="${base_image%@*}"
          base_digest=""
          artifact_name="typo3-phpfpm-${ARCH}-oci-archive"
          archive_path="${RUNNER_TEMP}/typo3-phpfpm-${ARCH}.tar"
          local_image="localhost/typo3-phpfpm:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}"

          if [ "${base_name}" != "${base_image}" ]; then
            base_digest="${base_image#*@}"
          fi

          echo "archive_path=${archive_path}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"
          echo "base_image=${base_image}" >> "$GITHUB_OUTPUT"
          echo "base_name=${base_name}" >> "$GITHUB_OUTPUT"
          echo "base_digest=${base_digest}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/typo3-phpfpm" >> "$GITHUB_OUTPUT"
          echo "local_image=${local_image}" >> "$GITHUB_OUTPUT"
          echo "typo3_data_dir=${typo3_data_dir}" >> "$GITHUB_OUTPUT"
          echo "version=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and export architecture image
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          ARCHIVE_PATH: ${{ steps.prep.outputs.archive_path }}
          BASE_DIGEST: ${{ steps.prep.outputs.base_digest }}
          BASE_IMAGE: ${{ steps.prep.outputs.base_image }}
          BASE_NAME: ${{ steps.prep.outputs.base_name }}
          CREATED: ${{ steps.prep.outputs.created }}
          LOCAL_IMAGE: ${{ steps.prep.outputs.local_image }}
          TYPO3_DATA_DIR: ${{ steps.prep.outputs.typo3_data_dir }}
          VERSION: ${{ steps.prep.outputs.version }}
        run: |
          set -euo pipefail

          no_cache_args=()

          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            no_cache_args+=(--no-cache)
          fi

          sudo buildah bud \
            --arch "${ARCH}" \
            --format oci \
            --pull-always \
            "${no_cache_args[@]}" \
            --build-arg "PODMAN_TYPO3PHPFPM_BASE_IMAGE=${BASE_IMAGE}" \
            --build-arg "PODMAN_TYPO3_DATA_DIR_CONTAINER=${TYPO3_DATA_DIR}" \
            --build-arg "OCI_BASE_DIGEST=${BASE_DIGEST}" \
            --build-arg "OCI_BASE_NAME=${BASE_NAME}" \
            --build-arg "OCI_CREATED=${CREATED}" \
            --build-arg "OCI_DESCRIPTION=${OCI_DESCRIPTION}" \
            --build-arg "OCI_DOCUMENTATION=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --build-arg "OCI_LICENSES=${OCI_LICENSES}" \
            --build-arg "OCI_REVISION=${GITHUB_SHA}" \
            --build-arg "OCI_SOURCE=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --build-arg "OCI_TITLE=${OCI_TITLE}" \
            --build-arg "OCI_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --build-arg "OCI_VENDOR=${OCI_VENDOR}" \
            --build-arg "OCI_VERSION=${VERSION}" \
            --tag "${LOCAL_IMAGE}" \
            --file compose/typo3-phpfpm/typo3-phpfpm \
            .

          sudo buildah push --format oci "${LOCAL_IMAGE}" "oci-archive:${ARCHIVE_PATH}"

      - name: Upload architecture image archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.prep.outputs.artifact_name }}
          path: ${{ steps.prep.outputs.archive_path }}
          if-no-files-found: error

  publish-manifest:
    name: Publish multi-arch manifest
    needs: build-arch-image
    runs-on: ubuntu-24.04

    steps:
      - name: Install OCI tooling
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends jq podman skopeo

      - name: Download amd64 image archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: typo3-phpfpm-amd64-oci-archive
          path: ${{ runner.temp }}/oci-archives/amd64

      - name: Download arm64 image archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: typo3-phpfpm-arm64-oci-archive
          path: ${{ runner.temp }}/oci-archives/arm64

      - name: Prepare publish tags
        id: prep
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          owner=$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/typo3-phpfpm"
          ref_tag=$(printf '%s' "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')
          sha_tag="sha-${GITHUB_SHA}"

          tags=("${sha_tag}")

          if [ -n "${ref_tag}" ]; then
            tags+=("${ref_tag}")
          fi

          if [ "${GITHUB_REF_NAME}" = "${DEFAULT_BRANCH}" ]; then
            tags+=("latest")
          fi

          unique_tags=()
          for tag in "${tags[@]}"; do
            skip=0
            for existing in "${unique_tags[@]}"; do
              if [ "${existing}" = "${tag}" ]; then
                skip=1
                break
              fi
            done
            if [ "${skip}" -eq 0 ]; then
              unique_tags+=("${tag}")
            fi
          done

          {
            echo "image=${image}"
            echo "sign_tag=${sha_tag}"
            echo "tags<<EOF"
            printf '%s\n' "${unique_tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          printf '%s' "${GITHUB_TOKEN}" | sudo podman login --username "${GITHUB_ACTOR}" --password-stdin ghcr.io

      - name: Create and push multi-arch manifest
        shell: bash
        env:
          AMD64_ARCHIVE: ${{ runner.temp }}/oci-archives/amd64/typo3-phpfpm-amd64.tar
          ARM64_ARCHIVE: ${{ runner.temp }}/oci-archives/arm64/typo3-phpfpm-arm64.tar
          IMAGE: ${{ steps.prep.outputs.image }}
          TAGS: ${{ steps.prep.outputs.tags }}
        run: |
          set -euo pipefail

          manifest_name="typo3-phpfpm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          local_image_amd64="localhost/typo3-phpfpm:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-amd64"
          local_image_arm64="localhost/typo3-phpfpm:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-arm64"
          trap 'sudo podman manifest rm "${manifest_name}" >/dev/null 2>&1 || true' EXIT

          sudo skopeo copy "oci-archive:${AMD64_ARCHIVE}" "containers-storage:${local_image_amd64}"
          sudo skopeo copy "oci-archive:${ARM64_ARCHIVE}" "containers-storage:${local_image_arm64}"

          sudo podman manifest create "${manifest_name}"
          sudo podman manifest add --arch amd64 "${manifest_name}" "containers-storage:${local_image_amd64}"
          sudo podman manifest add --arch arm64 "${manifest_name}" "containers-storage:${local_image_arm64}"

          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            sudo podman manifest push --all --format oci "${manifest_name}" "docker://${IMAGE}:${tag}"
          done <<< "${TAGS}"

      - name: Resolve image digests
        id: digests
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.prep.outputs.image }}
          SIGN_TAG: ${{ steps.prep.outputs.sign_tag }}
        run: |
          set -euo pipefail

          raw_manifest="${RUNNER_TEMP}/typo3-phpfpm-index.json"
          sudo skopeo inspect --raw --creds "${GITHUB_ACTOR}:${GITHUB_TOKEN}" "docker://${IMAGE}:${SIGN_TAG}" > "${raw_manifest}"

          amd64_digest=$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' "${raw_manifest}")
          arm64_digest=$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' "${raw_manifest}")
          index_digest=$(sudo skopeo inspect --creds "${GITHUB_ACTOR}:${GITHUB_TOKEN}" --format '{{.Digest}}' "docker://${IMAGE}:${SIGN_TAG}")

          test -n "${amd64_digest}" && test "${amd64_digest}" != "null"
          test -n "${arm64_digest}" && test "${arm64_digest}" != "null"

          {
            echo "amd64_digest=${amd64_digest}"
            echo "arm64_digest=${arm64_digest}"
            echo "index_digest=${index_digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Install Syft
        shell: bash
        run: |
          set -euo pipefail

          archive="syft_${SYFT_VERSION#v}_linux_amd64.tar.gz"
          curl -sSfL "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/${archive}" -o "${archive}"
          tar -xzf "${archive}" syft
          sudo install -m 0755 syft /usr/local/bin/syft

      - name: Generate SBOMs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AMD64_DIGEST: ${{ steps.digests.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.digests.outputs.arm64_digest }}
          IMAGE: ${{ steps.prep.outputs.image }}
        run: |
          set -euo pipefail

          printf '%s' "${GITHUB_TOKEN}" | syft login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          syft scan --from registry "${IMAGE}@${AMD64_DIGEST}" -o spdx-json=sbom-amd64.spdx.json
          syft scan --from registry "${IMAGE}@${ARM64_DIGEST}" -o spdx-json=sbom-arm64.spdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign image with Cosign
        shell: bash
        env:
          IMAGE: ${{ steps.prep.outputs.image }}
          INDEX_DIGEST: ${{ steps.digests.outputs.index_digest }}
        run: |
          set -euo pipefail

          cosign sign --yes --recursive "${IMAGE}@${INDEX_DIGEST}"

      - name: Attest build provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-digest: ${{ steps.digests.outputs.index_digest }}
          subject-name: ${{ steps.prep.outputs.image }}
          push-to-registry: true

      - name: Attest amd64 SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-digest: ${{ steps.digests.outputs.amd64_digest }}
          subject-name: ${{ steps.prep.outputs.image }}
          sbom-path: sbom-amd64.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest arm64 SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-digest: ${{ steps.digests.outputs.arm64_digest }}
          subject-name: ${{ steps.prep.outputs.image }}
          sbom-path: sbom-arm64.spdx.json
          push-to-registry: true
          create-storage-record: false
