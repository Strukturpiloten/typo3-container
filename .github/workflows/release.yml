name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version with optional leading v and prerelease, for example 1.2.3 or v1.2.3-rc.1
        required: true
        type: string
      renovate_major_release_count:
        description: How many major release streams Renovate should keep updating, for example 0 keeps only the default branch and 1 keeps only the current major.
        default: "1"
        required: true
        type: string
      renovate_minor_release_count:
        description: How many minor release branches per tracked major Renovate should keep updating, for example 0 keeps only the default branch and 1 keeps only the latest minor.
        default: "1"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  attestations: write
  artifact-metadata: write
  contents: write
  id-token: write
  packages: write
  pull-requests: write

env:
  OCI_DESCRIPTION: TYPO3 PHP-FPM runtime image with TYPO3 extensions and container utilities
  OCI_LICENSES: AGPL-3.0-only
  OCI_TITLE: TYPO3 PHP-FPM
  OCI_VENDOR: Strukturpiloten
  PREBUILT_TYPO3PHPFPM_IMAGE: ghcr.io/strukturpiloten/typo3-phpfpm
  PREBUILT_TYPO3PHPFPM_IMAGE_TEMPLATE_PREFIX: "PODMAN_TYPO3PHPFPM_IMAGE={{ if .UsePrebuiltTYPO3PHPFPMImage }}"
  PREBUILT_TYPO3PHPFPM_IMAGE_TEMPLATE_SUFFIX: "{{ else }}{{ .PodmanNamespace }}-{{ .PodmanService }}-{{ .PodmanStage }}-typo3-phpfpm:latest{{ end }}"
  RELEASE_METADATA_FILE: .release.env
  SYFT_VERSION: v1.44.0

jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    outputs:
      base_source_sha: ${{ steps.version.outputs.base_source_sha }}
      major: ${{ steps.version.outputs.major }}
      major_minor: ${{ steps.version.outputs.major_minor }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      renovate_major_count: ${{ steps.version.outputs.renovate_major_count }}
      renovate_minor_count: ${{ steps.version.outputs.renovate_minor_count }}
      release_branch: ${{ steps.version.outputs.release_branch }}
      release_branch_exists: ${{ steps.version.outputs.release_branch_exists }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Validate release version and source
        id: version
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RENOVATE_MAJOR_RELEASE_COUNT: ${{ inputs.renovate_major_release_count }}
          INPUT_RENOVATE_MINOR_RELEASE_COUNT: ${{ inputs.renovate_minor_release_count }}
        run: |
          set -euo pipefail

          version="${INPUT_VERSION#v}"
          renovate_major_count="${INPUT_RENOVATE_MAJOR_RELEASE_COUNT}"
          renovate_minor_count="${INPUT_RENOVATE_MINOR_RELEASE_COUNT}"

          if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "Version must match SemVer major.minor.patch with an optional prerelease, with or without a leading v." >&2
            exit 1
          fi

          for value_name in renovate_major_count renovate_minor_count; do
            if ! printf '%s' "${!value_name}" | grep -Eq '^(0|[1-9][0-9]*)$'; then
              echo "${value_name} must be a non-negative integer." >&2
              exit 1
            fi
          done

          stable_version="${version%%-*}"
          major="${stable_version%%.*}"
          rest="${stable_version#*.}"
          minor="${rest%%.*}"
          major_minor="${major}.${minor}"
          prerelease=false
          release_branch="v${major_minor}"
          tag="v${version}"

          if [ "${stable_version}" != "${version}" ]; then
            prerelease=true
          fi

          git fetch --tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"

          if git ls-remote --exit-code --heads origin "${release_branch}" >/dev/null 2>&1; then
            git fetch origin "+refs/heads/${release_branch}:refs/remotes/origin/${release_branch}"
            base_source_sha=$(git rev-parse "refs/remotes/origin/${release_branch}")
            release_branch_exists=true
          else
            if [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
              echo "New release line ${release_branch} must be started from the default branch ${DEFAULT_BRANCH}." >&2
              exit 1
            fi

            current_remote=$(git rev-parse "refs/remotes/origin/${DEFAULT_BRANCH}")
            if [ "${current_remote}" != "${GITHUB_SHA}" ]; then
              echo "Default branch ${DEFAULT_BRANCH} moved after this release workflow started." >&2
              echo "Start the release workflow again from the current default branch." >&2
              exit 1
            fi

            base_source_sha="${GITHUB_SHA}"
            release_branch_exists=false
          fi

          {
            echo "base_source_sha=${base_source_sha}"
            echo "major=${major}"
            echo "major_minor=${major_minor}"
            echo "prerelease=${prerelease}"
            echo "renovate_major_count=${renovate_major_count}"
            echo "renovate_minor_count=${renovate_minor_count}"
            echo "release_branch=${release_branch}"
            echo "release_branch_exists=${release_branch_exists}"
            echo "tag=${tag}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure release does not already exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists." >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Git tag ${TAG} already exists." >&2
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "${TAG}" >/dev/null 2>&1; then
            echo "Temporary release preparation branch ${TAG} already exists." >&2
            exit 1
          fi

  prepare-release-source:
    name: Prepare release source
    needs: prepare-release
    runs-on: ubuntu-24.04
    outputs:
      release_source_sha: ${{ steps.source.outputs.release_source_sha }}

    steps:
      - name: Check out release base source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.base_source_sha }}

      - name: Prepare release source branch
        id: source
        shell: bash
        env:
          BASE_SOURCE_SHA: ${{ needs.prepare-release.outputs.base_source_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IMAGE: ${{ env.PREBUILT_TYPO3PHPFPM_IMAGE }}
          RELEASE_BRANCH: ${{ needs.prepare-release.outputs.release_branch }}
          RELEASE_BRANCH_EXISTS: ${{ needs.prepare-release.outputs.release_branch_exists }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail

          branch="${TAG}"
          release_image="${IMAGE}:${TAG}"
          release_image_line="${PREBUILT_TYPO3PHPFPM_IMAGE_TEMPLATE_PREFIX}${release_image}${PREBUILT_TYPO3PHPFPM_IMAGE_TEMPLATE_SUFFIX}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags origin

          if [ "${RELEASE_BRANCH_EXISTS}" = "true" ]; then
            git fetch origin "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
            current_release_branch=$(git rev-parse "refs/remotes/origin/${RELEASE_BRANCH}")
            if [ "${current_release_branch}" != "${BASE_SOURCE_SHA}" ]; then
              echo "Release branch ${RELEASE_BRANCH} moved after the release source was selected." >&2
              echo "Start the release workflow again from the current release branch." >&2
              exit 1
            fi
          else
            git fetch origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
            current_default=$(git rev-parse "refs/remotes/origin/${DEFAULT_BRANCH}")
            if [ "${current_default}" != "${BASE_SOURCE_SHA}" ]; then
              echo "Default branch ${DEFAULT_BRANCH} moved after the release source was selected." >&2
              echo "Start the release workflow again from the current default branch." >&2
              exit 1
            fi

            if git ls-remote --exit-code --heads origin "${RELEASE_BRANCH}" >/dev/null 2>&1; then
              echo "Release branch ${RELEASE_BRANCH} was created after the release source was selected." >&2
              echo "Start the release workflow again from the current release branch." >&2
              exit 1
            fi

            git push origin "${BASE_SOURCE_SHA}:refs/heads/${RELEASE_BRANCH}"
          fi

          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            echo "Temporary release preparation branch ${branch} already exists." >&2
            exit 1
          fi

          git switch -c "${branch}" "${BASE_SOURCE_SHA}"

          tmp_env_tmpl="${RUNNER_TEMP}/env.tmpl"
          updated=false
          : > "${tmp_env_tmpl}"

          while IFS= read -r line; do
            if [ "${line#PODMAN_TYPO3PHPFPM_IMAGE=}" != "${line}" ]; then
              printf '%s\n' "${release_image_line}" >> "${tmp_env_tmpl}"
              updated=true
              continue
            fi

            printf '%s\n' "${line}" >> "${tmp_env_tmpl}"
          done < .env.tmpl

          if [ "${updated}" != "true" ]; then
            echo "Could not update PODMAN_TYPO3PHPFPM_IMAGE in .env.tmpl." >&2
            exit 1
          fi

          mv "${tmp_env_tmpl}" .env.tmpl
          grep -qxF "${release_image_line}" .env.tmpl

          git add .env.tmpl
          if git diff --cached --quiet; then
            echo ".env.tmpl already matches the requested release state." >&2
            exit 1
          fi

          git commit -m "chore(release): prepare ${TAG}"
          release_source_sha=$(git rev-parse HEAD)
          git push origin "HEAD:${branch}"

          echo "release_source_sha=${release_source_sha}" >> "$GITHUB_OUTPUT"

  update-renovate-config:
    name: Update Renovate branch targets
    needs:
      - prepare-release
      - prepare-release-source
    runs-on: ubuntu-24.04

    steps:
      - name: Check out default branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Open Renovate config pull request
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ needs.prepare-release.outputs.release_branch }}
          RENOVATE_MAJOR_RELEASE_COUNT: ${{ needs.prepare-release.outputs.renovate_major_count }}
          RENOVATE_MINOR_RELEASE_COUNT: ${{ needs.prepare-release.outputs.renovate_minor_count }}
        run: |
          set -euo pipefail

          branch="chore/release-renovate-${RELEASE_BRANCH}"
          title="chore(renovate): track ${RELEASE_BRANCH}"
          base_branches_file="${RUNNER_TEMP}/renovate-base-branches.txt"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"

          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            git fetch origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
          fi

          git switch -C "${branch}" "refs/remotes/origin/${DEFAULT_BRANCH}"

          BASE_BRANCHES_FILE="${base_branches_file}" python3 <<'PY'
          import json
          import os
          import re
          import subprocess

          config_path = ".github/renovate.json"
          release_branch = os.environ["RELEASE_BRANCH"]
          major_limit = int(os.environ["RENOVATE_MAJOR_RELEASE_COUNT"])
          minor_limit = int(os.environ["RENOVATE_MINOR_RELEASE_COUNT"])
          base_branches_file = os.environ["BASE_BRANCHES_FILE"]
          ref_pattern = re.compile(r"refs/heads/(v(?P<major>\d+)\.(?P<minor>\d+))$")

          result = subprocess.run(
            ["git", "ls-remote", "--heads", "origin", "v*"],
            check=True,
            capture_output=True,
            text=True,
          )

          release_branches = {}
          for raw_line in result.stdout.splitlines():
            parts = raw_line.split()
            if len(parts) != 2:
              continue

            _, ref = parts
            match = ref_pattern.fullmatch(ref)
            if match is None:
              continue

            release_branches[match.group(1)] = (
              int(match.group("major")),
              int(match.group("minor")),
            )

          current_match = re.fullmatch(r"v(?P<major>\d+)\.(?P<minor>\d+)", release_branch)
          if current_match is None:
            raise SystemExit(f"Release branch {release_branch} is not v<major>.<minor>.")

          release_branches[release_branch] = (
            int(current_match.group("major")),
            int(current_match.group("minor")),
          )

          selected_branches = []
          majors = sorted({major for major, _ in release_branches.values()}, reverse=True)
          for major in majors[:major_limit]:
            major_branches = sorted(
              (
                (minor, name)
                for name, (branch_major, minor) in release_branches.items()
                if branch_major == major
              ),
              reverse=True,
            )
            selected_branches.extend(name for _, name in major_branches[:minor_limit])

          configured_base_branches = ["$default", *selected_branches]

          with open(config_path, "r", encoding="utf-8") as handle:
            renovate_config = json.load(handle)

          if renovate_config.get("baseBranchPatterns") != configured_base_branches:
            renovate_config["baseBranchPatterns"] = configured_base_branches
            with open(config_path, "w", encoding="utf-8") as handle:
              json.dump(renovate_config, handle, indent=4)
              handle.write("\n")

          with open(base_branches_file, "w", encoding="utf-8") as handle:
            handle.write("\n".join(configured_base_branches))
            handle.write("\n")

          print("Configured Renovate base branches:", ", ".join(configured_base_branches))
          PY

          git add .github/renovate.json
          if git diff --cached --quiet; then
            echo ".github/renovate.json already tracks the requested release branches."
            exit 0
          fi

          git commit -m "${title}"
          git push --force-with-lease origin "HEAD:${branch}"

          existing_pr_number=$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --base "${DEFAULT_BRANCH}" \
            --head "${GITHUB_REPOSITORY_OWNER}:${branch}" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "${existing_pr_number}" ]; then
            echo "Renovate config PR #${existing_pr_number} already exists."
            exit 0
          fi

          body_file="${RUNNER_TEMP}/renovate-config-pr.md"
          {
            printf '%s\n\n' 'Renovate reads repository configuration from the default branch, so release-branch tracking has to be updated there separately.'
            printf '%s\n' 'Tracked base branches:'
            while IFS= read -r tracked_branch; do
              printf -- '- %s\n' "${tracked_branch}"
            done < "${base_branches_file}"
          } > "${body_file}"

          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${DEFAULT_BRANCH}" \
            --head "${GITHUB_REPOSITORY_OWNER}:${branch}" \
            --title "${title}" \
            --body-file "${body_file}"

  build-arch-image:
    name: Build ${{ matrix.arch }} release image
    needs:
      - prepare-release
      - prepare-release-source
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare-release-source.outputs.release_source_sha }}
          submodules: recursive

      - name: Install OCI tooling
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends buildah podman skopeo

      - name: Prepare image coordinates
        id: prep
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          base_image=$(grep '^PODMAN_TYPO3PHPFPM_BASE_IMAGE=' .env.tmpl | cut -d= -f2-)
          typo3_data_dir=$(grep '^PODMAN_TYPO3_DATA_DIR_CONTAINER=' .env.tmpl | cut -d= -f2-)
          base_name="${base_image%@*}"
          base_digest=""
          artifact_name="typo3-phpfpm-${ARCH}-oci-archive"
          archive_path="${RUNNER_TEMP}/typo3-phpfpm-${ARCH}.tar"
          local_image="localhost/typo3-phpfpm:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}"

          if [ "${base_name}" != "${base_image}" ]; then
            base_digest="${base_image#*@}"
          fi

          echo "archive_path=${archive_path}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"
          echo "base_image=${base_image}" >> "$GITHUB_OUTPUT"
          echo "base_name=${base_name}" >> "$GITHUB_OUTPUT"
          echo "base_digest=${base_digest}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "image=${PREBUILT_TYPO3PHPFPM_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "local_image=${local_image}" >> "$GITHUB_OUTPUT"
          echo "typo3_data_dir=${typo3_data_dir}" >> "$GITHUB_OUTPUT"

      - name: Build and export architecture image
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          ARCHIVE_PATH: ${{ steps.prep.outputs.archive_path }}
          BASE_DIGEST: ${{ steps.prep.outputs.base_digest }}
          BASE_IMAGE: ${{ steps.prep.outputs.base_image }}
          BASE_NAME: ${{ steps.prep.outputs.base_name }}
          CREATED: ${{ steps.prep.outputs.created }}
          LOCAL_IMAGE: ${{ steps.prep.outputs.local_image }}
          RELEASE_SOURCE_SHA: ${{ needs.prepare-release-source.outputs.release_source_sha }}
          TYPO3_DATA_DIR: ${{ steps.prep.outputs.typo3_data_dir }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail

          sudo buildah bud \
            --arch "${ARCH}" \
            --format oci \
            --no-cache \
            --pull-always \
            --build-arg "PODMAN_TYPO3PHPFPM_BASE_IMAGE=${BASE_IMAGE}" \
            --build-arg "PODMAN_TYPO3_DATA_DIR_CONTAINER=${TYPO3_DATA_DIR}" \
            --build-arg "OCI_BASE_DIGEST=${BASE_DIGEST}" \
            --build-arg "OCI_BASE_NAME=${BASE_NAME}" \
            --build-arg "OCI_CREATED=${CREATED}" \
            --build-arg "OCI_DESCRIPTION=${OCI_DESCRIPTION}" \
            --build-arg "OCI_DOCUMENTATION=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --build-arg "OCI_LICENSES=${OCI_LICENSES}" \
            --build-arg "OCI_REVISION=${RELEASE_SOURCE_SHA}" \
            --build-arg "OCI_SOURCE=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --build-arg "OCI_TITLE=${OCI_TITLE}" \
            --build-arg "OCI_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --build-arg "OCI_VENDOR=${OCI_VENDOR}" \
            --build-arg "OCI_VERSION=${VERSION}" \
            --tag "${LOCAL_IMAGE}" \
            --file compose/typo3-phpfpm/typo3-phpfpm \
            .

          sudo buildah push --format oci "${LOCAL_IMAGE}" "oci-archive:${ARCHIVE_PATH}"

      - name: Upload architecture image archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.prep.outputs.artifact_name }}
          path: ${{ steps.prep.outputs.archive_path }}
          if-no-files-found: error

  open-release-pr:
    name: Open release PR
    needs:
      - build-arch-image
      - prepare-release
      - prepare-release-source
    runs-on: ubuntu-24.04

    steps:
      - name: Check out release preparation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: refs/heads/${{ needs.prepare-release.outputs.tag }}

      - name: Install OCI tooling
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends jq podman skopeo

      - name: Download amd64 image archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: typo3-phpfpm-amd64-oci-archive
          path: ${{ runner.temp }}/oci-archives/amd64

      - name: Download arm64 image archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: typo3-phpfpm-arm64-oci-archive
          path: ${{ runner.temp }}/oci-archives/arm64

      - name: Prepare release candidate
        id: prep
        shell: bash
        env:
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail

          image="${PREBUILT_TYPO3PHPFPM_IMAGE}"
          candidate_tag="release-candidate-${TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          {
            echo "candidate_tag=${candidate_tag}"
            echo "image=${image}"
            echo "sign_tag=${candidate_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure final image tags do not already exist
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.prep.outputs.image }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail

          for tag in "${TAG}" "${VERSION}"; do
            if sudo skopeo inspect --creds "${GITHUB_ACTOR}:${GITHUB_TOKEN}" "docker://${IMAGE}:${tag}" >/dev/null 2>&1; then
              echo "Image tag ${IMAGE}:${tag} already exists." >&2
              exit 1
            fi
          done

      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          printf '%s' "${GITHUB_TOKEN}" | sudo podman login --username "${GITHUB_ACTOR}" --password-stdin ghcr.io

      - name: Create and push release candidate manifest
        shell: bash
        env:
          AMD64_ARCHIVE: ${{ runner.temp }}/oci-archives/amd64/typo3-phpfpm-amd64.tar
          ARM64_ARCHIVE: ${{ runner.temp }}/oci-archives/arm64/typo3-phpfpm-arm64.tar
          CANDIDATE_TAG: ${{ steps.prep.outputs.candidate_tag }}
          IMAGE: ${{ steps.prep.outputs.image }}
        run: |
          set -euo pipefail

          manifest_name="typo3-phpfpm-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          local_image_amd64="localhost/typo3-phpfpm:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-amd64"
          local_image_arm64="localhost/typo3-phpfpm:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-arm64"
          trap 'sudo podman manifest rm "${manifest_name}" >/dev/null 2>&1 || true' EXIT

          sudo skopeo copy "oci-archive:${AMD64_ARCHIVE}" "containers-storage:${local_image_amd64}"
          sudo skopeo copy "oci-archive:${ARM64_ARCHIVE}" "containers-storage:${local_image_arm64}"

          sudo podman manifest create "${manifest_name}"
          sudo podman manifest add --arch amd64 "${manifest_name}" "containers-storage:${local_image_amd64}"
          sudo podman manifest add --arch arm64 "${manifest_name}" "containers-storage:${local_image_arm64}"
          sudo podman manifest push --all --format oci "${manifest_name}" "docker://${IMAGE}:${CANDIDATE_TAG}"

      - name: Resolve image digests
        id: digests
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.prep.outputs.image }}
          SIGN_TAG: ${{ steps.prep.outputs.sign_tag }}
        run: |
          set -euo pipefail

          raw_manifest="${RUNNER_TEMP}/typo3-phpfpm-release-index.json"
          sudo skopeo inspect --raw --creds "${GITHUB_ACTOR}:${GITHUB_TOKEN}" "docker://${IMAGE}:${SIGN_TAG}" > "${raw_manifest}"

          amd64_digest=$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' "${raw_manifest}")
          arm64_digest=$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' "${raw_manifest}")
          index_digest=$(sudo skopeo inspect --creds "${GITHUB_ACTOR}:${GITHUB_TOKEN}" --format '{{.Digest}}' "docker://${IMAGE}:${SIGN_TAG}")

          test -n "${amd64_digest}" && test "${amd64_digest}" != "null"
          test -n "${arm64_digest}" && test "${arm64_digest}" != "null"

          {
            echo "amd64_digest=${amd64_digest}"
            echo "arm64_digest=${arm64_digest}"
            echo "index_digest=${index_digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Install Syft
        shell: bash
        run: |
          set -euo pipefail

          archive="syft_${SYFT_VERSION#v}_linux_amd64.tar.gz"
          curl -sSfL "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/${archive}" -o "${archive}"
          tar -xzf "${archive}" syft
          sudo install -m 0755 syft /usr/local/bin/syft

      - name: Generate SBOMs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AMD64_DIGEST: ${{ steps.digests.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.digests.outputs.arm64_digest }}
          IMAGE: ${{ steps.prep.outputs.image }}
        run: |
          set -euo pipefail

          printf '%s' "${GITHUB_TOKEN}" | syft login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          syft scan --from registry "${IMAGE}@${AMD64_DIGEST}" -o spdx-json=sbom-amd64.spdx.json
          syft scan --from registry "${IMAGE}@${ARM64_DIGEST}" -o spdx-json=sbom-arm64.spdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign image with Cosign
        shell: bash
        env:
          IMAGE: ${{ steps.prep.outputs.image }}
          INDEX_DIGEST: ${{ steps.digests.outputs.index_digest }}
        run: |
          set -euo pipefail

          cosign sign --yes --recursive "${IMAGE}@${INDEX_DIGEST}"

      - name: Attest build provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-digest: ${{ steps.digests.outputs.index_digest }}
          subject-name: ${{ steps.prep.outputs.image }}
          push-to-registry: true

      - name: Attest amd64 SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-digest: ${{ steps.digests.outputs.amd64_digest }}
          subject-name: ${{ steps.prep.outputs.image }}
          sbom-path: sbom-amd64.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest arm64 SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-digest: ${{ steps.digests.outputs.arm64_digest }}
          subject-name: ${{ steps.prep.outputs.image }}
          sbom-path: sbom-arm64.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Open release pull request
        shell: bash
        env:
          BASE_SOURCE_SHA: ${{ needs.prepare-release.outputs.base_source_sha }}
          CANDIDATE_TAG: ${{ steps.prep.outputs.candidate_tag }}
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.prep.outputs.image }}
          INDEX_DIGEST: ${{ steps.digests.outputs.index_digest }}
          PRERELEASE: ${{ needs.prepare-release.outputs.prerelease }}
          RELEASE_BRANCH: ${{ needs.prepare-release.outputs.release_branch }}
          RELEASE_SOURCE_SHA: ${{ needs.prepare-release-source.outputs.release_source_sha }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail

          branch="${TAG}"
          release_image="${IMAGE}:${TAG}@${INDEX_DIGEST}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags origin

          if [ "$(git rev-parse HEAD)" != "${RELEASE_SOURCE_SHA}" ]; then
            echo "Temporary release preparation branch ${branch} moved after the release image was built." >&2
            exit 1
          fi

          git fetch origin "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
          current_release_branch=$(git rev-parse "refs/remotes/origin/${RELEASE_BRANCH}")
          if [ "${current_release_branch}" != "${BASE_SOURCE_SHA}" ]; then
            echo "Release branch ${RELEASE_BRANCH} moved after the release image was built." >&2
            echo "Start the release workflow again from the current release branch." >&2
            exit 1
          fi

          release_image_line="${PREBUILT_TYPO3PHPFPM_IMAGE_TEMPLATE_PREFIX}${release_image}${PREBUILT_TYPO3PHPFPM_IMAGE_TEMPLATE_SUFFIX}"
          tmp_env_tmpl="${RUNNER_TEMP}/env.tmpl"
          updated=false
          : > "${tmp_env_tmpl}"

          while IFS= read -r line; do
            if [ "${line#PODMAN_TYPO3PHPFPM_IMAGE=}" != "${line}" ]; then
              printf '%s\n' "${release_image_line}" >> "${tmp_env_tmpl}"
              updated=true
              continue
            fi

            printf '%s\n' "${line}" >> "${tmp_env_tmpl}"
          done < .env.tmpl

          if [ "${updated}" != "true" ]; then
            echo "Could not update PODMAN_TYPO3PHPFPM_IMAGE in .env.tmpl." >&2
            exit 1
          fi

          mv "${tmp_env_tmpl}" .env.tmpl
          grep -qxF "${release_image_line}" .env.tmpl

          {
            echo "RELEASE_TAG=${TAG}"
            echo "RELEASE_VERSION=${VERSION}"
            echo "RELEASE_BRANCH=${RELEASE_BRANCH}"
            echo "RELEASE_BASE_SOURCE_SHA=${BASE_SOURCE_SHA}"
            echo "RELEASE_SOURCE_SHA=${RELEASE_SOURCE_SHA}"
            echo "RELEASE_IMAGE=${IMAGE}"
            echo "RELEASE_IMAGE_DIGEST=${INDEX_DIGEST}"
            echo "RELEASE_IMAGE_REF=${release_image}"
            echo "RELEASE_PRERELEASE=${PRERELEASE}"
          } > "${RELEASE_METADATA_FILE}"

          git add .env.tmpl "${RELEASE_METADATA_FILE}"
          if git diff --cached --quiet; then
            echo ".env.tmpl and ${RELEASE_METADATA_FILE} already reference ${release_image}." >&2
            exit 1
          fi

          git commit -m "chore(release): pin ${TAG} image digest"
          git push origin "HEAD:${branch}"

          body_file="${RUNNER_TEMP}/release-pr.md"
          {
            printf 'Release %s\n\n' "${TAG}"
            printf 'Release line branch:\n%s\n\n' "${RELEASE_BRANCH}"
            printf 'Release branch base commit:\n%s\n\n' "${BASE_SOURCE_SHA}"
            printf 'Release source commit built into the image:\n%s\n\n' "${RELEASE_SOURCE_SHA}"
            printf 'This PR pins .env.tmpl to:\n%s\n\n' "${release_image}"
            printf 'Release candidate image:\n%s:%s\n\n' "${IMAGE}" "${CANDIDATE_TAG}"
            printf '%s\n\n' 'Merge method: use Create a merge commit. Do not squash or rebase this PR.'
            printf '%s\n' 'Merging this PR triggers the Finalize release workflow. That workflow promotes the pinned digest to the final container tags, creates the git tag on the release source commit, and creates the GitHub Release.'
          } > "${body_file}"

          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${RELEASE_BRANCH}" \
            --head "${GITHUB_REPOSITORY_OWNER}:${branch}" \
            --title "chore(release): ${TAG}" \
            --body-file "${body_file}"
