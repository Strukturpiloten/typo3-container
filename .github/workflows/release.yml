name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: SemVer version without leading v, for example 1.2.3
                required: true
                type: string

concurrency:
    group: release-${{ inputs.version }}
    cancel-in-progress: false

permissions:
    contents: write
    id-token: write
    packages: write

env:
    OCI_LICENSES: AGPL-3.0-only
    OCI_VENDOR: Strukturpiloten

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Validate release version
              id: version
              shell: bash
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
                  INPUT_VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail

                  if [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
                    echo "Releases must be started from the default branch ${DEFAULT_BRANCH}." >&2
                    exit 1
                  fi

                  version="${INPUT_VERSION}"

                  if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                    echo "Version must match SemVer major.minor.patch without a leading v." >&2
                    exit 1
                  fi

                  major="${version%%.*}"
                  rest="${version#*.}"
                  minor="${rest%%.*}"

                  echo "tag=v${version}" >> "$GITHUB_OUTPUT"
                  echo "version=${version}" >> "$GITHUB_OUTPUT"
                  echo "major=${major}" >> "$GITHUB_OUTPUT"
                  echo "major_minor=${major}.${minor}" >> "$GITHUB_OUTPUT"

            - name: Ensure release does not already exist
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail

                  if gh release view "${{ steps.version.outputs.tag }}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
                    echo "Release ${{ steps.version.outputs.tag }} already exists." >&2
                    exit 1
                  fi

            - name: Prepare image coordinates
              id: prep
              shell: bash
              run: |
                  set -euo pipefail

                  owner=$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
                  base_image=$(grep '^PODMAN_TYPO3PHPFPM_IMAGE=' .env.tmpl | cut -d= -f2-)
                  typo3_data_dir=$(grep '^PODMAN_TYPO3_DATA_DIR_CONTAINER=' .env.tmpl | cut -d= -f2-)
                  base_name="${base_image%@*}"
                  base_digest=""

                  if [ "${base_name}" != "${base_image}" ]; then
                    base_digest="${base_image#*@}"
                  fi

                  echo "image=ghcr.io/${owner}/typo3-phpfpm" >> "$GITHUB_OUTPUT"
                  echo "base_image=${base_image}" >> "$GITHUB_OUTPUT"
                  echo "typo3_data_dir=${typo3_data_dir}" >> "$GITHUB_OUTPUT"
                  echo "base_name=${base_name}" >> "$GITHUB_OUTPUT"
                  echo "base_digest=${base_digest}" >> "$GITHUB_OUTPUT"
                  echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
              with:
                  images: ${{ steps.prep.outputs.image }}
                  tags: |
                      type=raw,value=latest
                      type=raw,value=${{ steps.version.outputs.tag }}
                      type=raw,value=${{ steps.version.outputs.version }}
                      type=raw,value=${{ steps.version.outputs.major_minor }}
                      type=raw,value=${{ steps.version.outputs.major }}
                      type=sha,prefix=sha-

            - name: Set up QEMU
              uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push multi-arch image
              id: build
              uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
              with:
                  context: .
                  file: compose/typo3-phpfpm/typo3-phpfpm
                  platforms: linux/amd64,linux/arm64
                  push: true
                  pull: true
                  no-cache: true
                  sbom: true
                  provenance: mode=max
                  tags: ${{ steps.meta.outputs.tags }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: |
                      PODMAN_TYPO3PHPFPM_IMAGE=${{ steps.prep.outputs.base_image }}
                      PODMAN_TYPO3_DATA_DIR_CONTAINER=${{ steps.prep.outputs.typo3_data_dir }}
                      OCI_BASE_DIGEST=${{ steps.prep.outputs.base_digest }}
                      OCI_BASE_NAME=${{ steps.prep.outputs.base_name }}
                      OCI_CREATED=${{ steps.prep.outputs.created }}
                      OCI_DESCRIPTION=TYPO3 PHP-FPM runtime image with TYPO3 extensions and container utilities
                      OCI_DOCUMENTATION=${{ github.server_url }}/${{ github.repository }}
                      OCI_LICENSES=${{ env.OCI_LICENSES }}
                      OCI_REVISION=${{ github.sha }}
                      OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}
                      OCI_TITLE=TYPO3 PHP-FPM
                      OCI_URL=${{ github.server_url }}/${{ github.repository }}
                      OCI_VENDOR=${{ env.OCI_VENDOR }}
                      OCI_VERSION=${{ steps.version.outputs.version }}
                  outputs: type=image,name=${{ steps.prep.outputs.image }},annotation-index.org.opencontainers.image.description=TYPO3 PHP-FPM runtime image with TYPO3 extensions and container utilities

            - name: Install Cosign
              uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
              with:
                  cosign-release: v3.0.6

            - name: Sign image with Cosign
              if: ${{ steps.build.outputs.digest != '' }}
              shell: bash
              env:
                  IMAGE: ${{ steps.prep.outputs.image }}
                  DIGEST: ${{ steps.build.outputs.digest }}
              run: |
                  set -euo pipefail

                  cosign sign --yes --recursive "${IMAGE}@${DIGEST}"

            - name: Create GitHub release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail

                  gh release create "${{ steps.version.outputs.tag }}" \
                    --repo "${GITHUB_REPOSITORY}" \
                    --target "${GITHUB_SHA}" \
                    --generate-notes \
                    --title "${{ steps.version.outputs.tag }}"
