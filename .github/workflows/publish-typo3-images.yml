name: Publish TYPO3 images

on:
    push:
        branches:
            - main
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: read
    packages: write

env:
    OCI_LICENSES: AGPL-3.0-only
    OCI_VENDOR: Strukturpiloten

jobs:
    publish-typo3-images:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - image_name: typo3-phpfpm
                      dockerfile: compose/typo3-phpfpm/typo3-phpfpm
                      oci_description: TYPO3 PHP-FPM runtime image with TYPO3 extensions and container utilities
                      oci_title: TYPO3 PHP-FPM
                    - image_name: typo3-installer
                      dockerfile: compose/typo3-installer/typo3-installer
                      oci_description: TYPO3 installer image with TYPO3 CLI tooling and container utilities
                      oci_title: TYPO3 Installer
                    - image_name: typo3-manager
                      dockerfile: compose/typo3-manager/typo3-manager
                      oci_description: TYPO3 manager image with TYPO3 CLI tooling, cron support, and container utilities
                      oci_title: TYPO3 Manager

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Prepare image coordinates
              id: prep
              shell: bash
              run: |
                  set -euo pipefail

                  owner=$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
                  base_image=$(grep '^PODMAN_TYPO3PHPFPM_IMAGE=' .env.tmpl | cut -d= -f2-)
                  typo3_data_dir=$(grep '^PODMAN_TYPO3_DATA_DIR_CONTAINER=' .env.tmpl | cut -d= -f2-)
                  base_name="${base_image%@*}"
                  base_digest=""

                  if [ "${base_name}" != "${base_image}" ]; then
                    base_digest="${base_image#*@}"
                  fi

                  echo "image=ghcr.io/${owner}/${{ matrix.image_name }}" >> "$GITHUB_OUTPUT"
                  echo "base_image=${base_image}" >> "$GITHUB_OUTPUT"
                  echo "typo3_data_dir=${typo3_data_dir}" >> "$GITHUB_OUTPUT"
                  echo "base_name=${base_name}" >> "$GITHUB_OUTPUT"
                  echo "base_digest=${base_digest}" >> "$GITHUB_OUTPUT"
                  echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ steps.prep.outputs.image }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=ref,event=branch
                      type=ref,event=tag
                      type=sha,prefix=sha-
                      type=semver,pattern={{version}},value=${{ github.ref_name }}
                      type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push multi-arch image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: |
                      PODMAN_TYPO3PHPFPM_IMAGE=${{ steps.prep.outputs.base_image }}
                      PODMAN_TYPO3_DATA_DIR_CONTAINER=${{ steps.prep.outputs.typo3_data_dir }}
                      OCI_BASE_DIGEST=${{ steps.prep.outputs.base_digest }}
                      OCI_BASE_NAME=${{ steps.prep.outputs.base_name }}
                      OCI_CREATED=${{ steps.prep.outputs.created }}
                      OCI_DESCRIPTION=${{ matrix.oci_description }}
                      OCI_DOCUMENTATION=${{ github.server_url }}/${{ github.repository }}
                      OCI_LICENSES=${{ env.OCI_LICENSES }}
                      OCI_REVISION=${{ github.sha }}
                      OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}
                      OCI_TITLE=${{ matrix.oci_title }}
                      OCI_URL=${{ github.server_url }}/${{ github.repository }}
                      OCI_VENDOR=${{ env.OCI_VENDOR }}
                      OCI_VERSION=${{ steps.meta.outputs.version }}
                  outputs: type=image,name=${{ steps.prep.outputs.image }},annotation-index.org.opencontainers.image.description=${{ matrix.oci_description }}
